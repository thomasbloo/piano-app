name: Publication GitHub Pages

# Publishes the app at https://<owner>.github.io/<repo>/ after every change on main.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The app needs no build: publish the files as they are, without the dev-only folders.
      - run: mkdir _site && cp -r index.html manifest.webmanifest sw.js icon.svg src fonts vendor scores _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
