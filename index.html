<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1830" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Piano</title>
  </head>
  <body>
    <header class="topbar">
      <div class="title-row">
        <nav class="tabs" aria-label="Volets">
          <button type="button" data-view="keyboard">Clavier</button>
          <button type="button" data-view="exercises">Exercices</button>
          <button type="button" data-view="scales">Gammes</button>
          <button type="button" data-view="library">Partitions</button>
        </nav>
        <div class="spacer"></div>
        <p id="streak" class="chip streak" hidden>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 0 2 1 3 2 3 0-3-1-6 .5-9z" /></svg>
          <span id="streak-text"></span>
        </p>
        <p id="midi-status" class="chip midi" hidden><span class="dot" aria-hidden="true"></span><span id="midi-name"></span></p>
        <p id="midi-message" class="status"></p>
        <button type="button" id="settings-btn" class="round" aria-label="Réglages" aria-expanded="false" aria-controls="settings">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" /><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" /></svg>
        </button>
      </div>
      <div id="settings" class="controls settings" hidden>
        <label>
          Noms des notes
          <select id="labels">
            <option value="none">Aucun</option>
            <option value="letters">Lettres (C D E)</option>
            <option value="solfege">Solfège (Do Ré Mi)</option>
          </select>
        </label>
        <label>
          Clavier
          <select id="octaves">
            <option value="2">2 octaves</option>
            <option value="3">3 octaves</option>
            <option value="4">4 octaves</option>
            <option value="5">61 touches (NP15)</option>
          </select>
        </label>
        <label>
          Thème
          <select id="theme">
            <option value="dark">Sombre</option>
            <option value="light">Clair</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="sound" /> Son</label>
        <button id="midi-btn" type="button">Connecter le MIDI</button>
      </div>
    </header>
    <main>
      <section id="view-keyboard" class="view">
        <p class="last-note">Dernière note : <strong id="last-note">–</strong></p>
      </section>

      <section id="view-exercises" class="view">
        <div class="controls">
          <label>
            Clé
            <select id="ex-clef">
              <option value="treble">Sol</option>
              <option value="bass">Fa</option>
              <option value="both">Sol et fa</option>
            </select>
          </label>
          <label>
            Notes
            <select id="ex-level">
              <option value="staff">Sur la portée</option>
              <option value="ledger">Avec lignes supplémentaires</option>
            </select>
          </label>
          <label>
            Exercice
            <select id="ex-mode">
              <option value="single">Une note</option>
              <option value="sequence">Suite de 8 notes</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="ex-accidentals" /> Dièses</label>
          <label class="check"><input type="checkbox" id="ex-octave" /> Octave exacte</label>
        </div>
        <div id="staff" class="staff-box"></div>
        <p id="ex-feedback" class="feedback" aria-live="polite">Jouez la note affichée.</p>
        <div class="ex-footer">
          <p id="ex-stats" class="status"></p>
          <button id="ex-skip" type="button">Passer</button>
        </div>
      </section>

      <section id="view-scales" class="view">
        <div class="practice-bar">
          <div class="card">
            <select id="sc-tonic" aria-label="Tonique"></select>
            <select id="sc-type" aria-label="Type de gamme">
              <option value="major">Majeure</option>
              <option value="natural">Mineure nat.</option>
              <option value="harmonic">Mineure harm.</option>
              <option value="melodic">Mineure mél.</option>
              <option value="chromatic">Chromatique</option>
            </select>
            <select id="sc-octaves" aria-label="Étendue">
              <option value="1">1 octave</option>
              <option value="2">2 octaves</option>
            </select>
            <select id="sc-direction" aria-label="Sens">
              <option value="updown">Aller-retour</option>
              <option value="up">Montée</option>
            </select>
          </div>
          <div class="card" role="group" aria-label="Main">
            <button type="button" class="seg hand-right" data-sc-hand="right">Droite</button>
            <button type="button" class="seg hand-left" data-sc-hand="left">Gauche</button>
            <button type="button" class="seg" data-sc-hand="both" title="Les deux mains à une octave d'écart">Les deux</button>
            <button type="button" class="seg" data-sc-hand="contrary" title="Mouvement contraire : les deux mains partent de la même note et s'écartent">Contraire</button>
          </div>
        </div>
        <div class="practice-bar">
          <div class="card">
            <button type="button" class="icon-btn" data-sc-mode="wait" aria-label="Note par note" title="Note par note : l'app attend la bonne note">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5v14M19 12H9M14 7l5 5-5 5" /></svg>
            </button>
            <button type="button" class="icon-btn" data-sc-mode="tempo" aria-label="Au tempo" title="Au tempo : le curseur avance avec le métronome, la régularité est notée">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2M10 2h4" /></svg>
            </button>
            <select id="sc-tempo" aria-label="Tempo"></select>
            <select id="sc-per-beat" aria-label="Notes par temps" title="Notes par temps : noires (1), croches (2), doubles croches (4)">
              <option value="1">Noires</option>
              <option value="2">Croches</option>
              <option value="4">Doubles</option>
            </select>
            <button type="button" id="sc-metronome" class="icon-btn" aria-label="Métronome" title="Métronome pendant la gamme">
              <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5z" /><path d="M7.5 15h9M12 15l5-9" /></svg>
            </button>
            <button type="button" id="sc-fingers" class="icon-btn" aria-label="Doigtés" title="Montrer les doigtés">
              <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L4 15.5a1.6 1.6 0 0 1 2.5-2L8 15" /></svg>
            </button>
            <button type="button" id="sc-keys" class="icon-btn hint-btn" aria-label="Montrer les touches" title="Montrer les touches et les doigts sur le clavier">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" /></svg>
            </button>
          </div>
          <div class="card" role="group" aria-label="Noms des notes">
            <button type="button" class="seg" data-notation="solfege">Do Ré Mi</button>
            <button type="button" class="seg" data-notation="letters">C D E</button>
          </div>
          <button type="button" id="sc-listen" class="listen">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
            <span id="sc-listen-text">Écouter</span>
          </button>
          <button type="button" id="sc-start" class="play">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z" /></svg>
            <span id="sc-start-text">Jouer</span>
          </button>
        </div>
        <div class="scale-head">
          <h2 id="sc-title"></h2>
          <p id="sc-key"></p>
        </div>
        <div id="sc-staff" class="staff-box scale-box"></div>
        <p id="sc-tips" class="scale-tips"></p>
        <p id="sc-feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section id="view-library" class="view">
        <div id="lib-index">
          <div class="lib-actions">
            <div class="controls">
              <label>
                Afficher
                <select id="lib-filter">
                  <option value="">Tous les niveaux</option>
                </select>
              </label>
              <label>
                Niveau des partitions importées
                <select id="lib-level"></select>
              </label>
              <label class="button">
                Importer une partition (MusicXML ou MuseScore)
                <input type="file" id="lib-file" accept=".musicxml,.xml,.mxl,.mscz,.mscx" multiple hidden />
              </label>
            </div>
          </div>
          <div id="lib-list"></div>
        </div>
        <div id="lib-viewer" hidden>
          <div class="practice-bar">
            <div class="card score-card">
              <button type="button" id="lib-back" class="round" aria-label="Toutes les partitions">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
              </button>
              <svg class="ring" width="44" height="44" viewBox="0 0 44 44" role="img" aria-labelledby="pr-percent">
                <circle cx="22" cy="22" r="18" class="ring-track" />
                <circle cx="22" cy="22" r="18" class="ring-fill" id="pr-ring" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 22 22)" />
                <text x="22" y="26" text-anchor="middle" id="pr-percent">0%</text>
              </svg>
              <div class="score-titles">
                <h2 id="lib-viewer-title"></h2>
                <p id="pr-progress"></p>
              </div>
            </div>
            <div class="card" role="group" aria-label="Main">
              <button type="button" class="seg hand-right" data-hand="right">Droite</button>
              <button type="button" class="seg hand-left" data-hand="left">Gauche</button>
              <button type="button" class="seg" data-hand="both">Les deux</button>
            </div>
            <div class="card">
              <button type="button" class="icon-btn" data-mode="wait" aria-label="Note par note" title="Note par note">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5v14M19 12H9M14 7l5 5-5 5" /></svg>
              </button>
              <button type="button" class="icon-btn" data-mode="realtime" aria-label="Temps réel" title="Temps réel">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2M10 2h4" /></svg>
              </button>
              <button type="button" id="pr-keys" class="icon-btn hint-btn" aria-label="Montrer la prochaine touche" title="Montrer la prochaine touche">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" /></svg>
              </button>
              <button type="button" id="pr-other" class="icon-btn" aria-label="Jouer l'autre main automatiquement" title="Jouer l'autre main automatiquement">
                <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
              </button>
            </div>
            <button type="button" id="pr-listen" class="listen">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
              <span id="pr-listen-text">Écouter</span>
            </button>
            <button type="button" id="pr-start" class="play">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z" /></svg>
              <span id="pr-start-text">Jouer</span>
            </button>
          </div>
          <div class="score-wrap">
            <div id="score" class="score-box"></div>
            <div class="score-footer">
              <div class="score-tools">
                <button type="button" id="pr-passage" class="score-chip">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4v16M20 4v16M8 12h8M11 9l-3 3 3 3M13 9l3 3-3 3" /></svg>
                  <span id="pr-passage-text">Tout le morceau</span>
                </button>
                <button type="button" id="pr-passage-clear" class="score-chip" aria-label="Revenir au morceau entier" hidden>
                  <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
                </button>
                <select id="pr-speed" class="score-chip" aria-label="Vitesse">
                  <option value="0.5">Vitesse 50 %</option>
                  <option value="0.75">Vitesse 75 %</option>
                  <option value="1">Vitesse 100 %</option>
                </select>
              </div>
              <p id="pr-feedback" class="feedback score-message" aria-live="polite"></p>
              <p id="pr-toast" class="toast" aria-hidden="true"></p>
            </div>
          </div>
        </div>
        <p id="lib-status" class="status" aria-live="polite"></p>
      </section>

      <div id="keyboard" class="keyboard-scroll"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
