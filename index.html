<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2933" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Piano</title>
  </head>
  <body>
    <header class="topbar">
      <div class="title-row">
        <h1>Piano</h1>
        <nav class="tabs" aria-label="Volets">
          <button type="button" data-view="keyboard">Clavier libre</button>
          <button type="button" data-view="exercises">Exercices</button>
          <button type="button" data-view="library">Partitions</button>
        </nav>
      </div>
      <div class="controls">
        <label>
          Noms des notes
          <select id="labels">
            <option value="none">Aucun</option>
            <option value="letters">Lettres (C D E)</option>
            <option value="solfege">Solfège (Do Ré Mi)</option>
          </select>
        </label>
        <label>
          Clavier
          <select id="octaves">
            <option value="2">2 octaves</option>
            <option value="3">3 octaves</option>
            <option value="4">4 octaves</option>
            <option value="5">61 touches (NP15)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="sound" /> Son</label>
        <button id="midi-btn" type="button">Connecter le MIDI</button>
      </div>
      <p id="midi-status" class="status"></p>
    </header>
    <main>
      <section id="view-keyboard" class="view">
        <p class="last-note">Dernière note : <strong id="last-note">–</strong></p>
      </section>

      <section id="view-exercises" class="view">
        <div class="controls">
          <label>
            Clé
            <select id="ex-clef">
              <option value="treble">Sol</option>
              <option value="bass">Fa</option>
              <option value="both">Sol et fa</option>
            </select>
          </label>
          <label>
            Notes
            <select id="ex-level">
              <option value="staff">Sur la portée</option>
              <option value="ledger">Avec lignes supplémentaires</option>
            </select>
          </label>
          <label>
            Exercice
            <select id="ex-mode">
              <option value="single">Une note</option>
              <option value="sequence">Suite de 8 notes</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="ex-accidentals" /> Dièses</label>
          <label class="check"><input type="checkbox" id="ex-octave" /> Octave exacte</label>
        </div>
        <div id="staff" class="staff-box"></div>
        <p id="ex-feedback" class="feedback" aria-live="polite">Jouez la note affichée.</p>
        <div class="ex-footer">
          <p id="ex-stats" class="status"></p>
          <button id="ex-skip" type="button">Passer</button>
        </div>
      </section>

      <section id="view-library" class="view">
        <div id="lib-index">
          <div class="lib-actions">
            <div class="controls">
              <label>
                Afficher
                <select id="lib-filter">
                  <option value="">Tous les niveaux</option>
                </select>
              </label>
              <label>
                Niveau des partitions importées
                <select id="lib-level"></select>
              </label>
              <label class="button">
                Importer une partition (MusicXML)
                <input type="file" id="lib-file" accept=".musicxml,.xml,.mxl" multiple hidden />
              </label>
            </div>
          </div>
          <div id="lib-list"></div>
        </div>
        <div id="lib-viewer" hidden>
          <div class="lib-actions">
            <button type="button" id="lib-back">← Toutes les partitions</button>
            <h2 id="lib-viewer-title"></h2>
          </div>
          <div class="controls practice-bar">
            <label>
              Main
              <select id="pr-hand">
                <option value="right">Main droite</option>
                <option value="left">Main gauche</option>
                <option value="both">Les deux mains</option>
              </select>
            </label>
            <label>
              Mode
              <select id="pr-mode">
                <option value="wait">Note par note</option>
                <option value="realtime">Temps réel</option>
              </select>
            </label>
            <label>
              Vitesse
              <select id="pr-speed">
                <option value="0.5">50 %</option>
                <option value="0.75">75 %</option>
                <option value="1">100 %</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="pr-keys" /> Montrer les touches</label>
            <button type="button" id="pr-start" class="primary">Commencer</button>
          </div>
          <p id="pr-feedback" class="feedback" aria-live="polite"></p>
          <div id="score" class="score-box"></div>
        </div>
        <p id="lib-status" class="status" aria-live="polite"></p>
      </section>

      <div id="keyboard" class="keyboard-scroll"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
